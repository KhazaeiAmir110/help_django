<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo</title>
</head>
<body>
<h1>Todo List</h1>
<ul>
    {% for lis in list %}
        <li><a href="{% url 'detail' lis.id %}">{{ lis.title }}</a></li>
        <form action="{% url 'delete_list' lis.id %}" method="post">
            {% csrf_token %}
            <button type="submit">Delete</button>
        </form>
    {% endfor %}
</ul>

<form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit</button>
</form>
</body>
</html>
